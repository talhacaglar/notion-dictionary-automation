<text x="90" y="552" font-family="monospace" font-size="21" fill="#e4e9e4">{ "kelime": "clarity", "anlam": "...", "cumle": "..." }</text>
<text x="1080" y="509" font-size="16" fill="#78c6b8">EXTERNAL FLOW</text><text x="1080" y="543" font-size="17" fill="#adb9b8">Configured in ActivePieces</text><text x="1080" y="568" font-size="17" fill="#adb9b8">Harici akış yapılandırması</text>
<text x="66" y="635" font-size="14" fill="#839693">Implementation flow / Uygulama akışı — main.py</text>
